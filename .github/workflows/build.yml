name: OrangeFox - Builder
on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Building OrangeFox Recovery
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (Prevent Storage Full)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (Prevent OOM Kill)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 8

      - name: OrangeFox Build
        uses: really-yash/UWU-OrangeFox-Builder@main
        with:
          FOX_SYNC_BRANCH: '12.1'
          USER_NAME: 'Yash'
          USER_EMAIL: 'bloxfruits_yash@example.com'
          DEVICE_TREE: 'https://github.com/really-yash/twrp_device_xiaomi_air'
          DEVICE_TREE_BRANCH: 'twrp-16.0'
          DEVICE_PATH: 'device/xiaomi/air'
          DEVICE_NAME: 'air'
          BUILD_TARGET: 'recovery'
          GH_RELEASE: 'true'

      - name: Verify Build Output Is Real (Not Corrupted/Empty)
        run: |
          OUT_DIR="/home/runner/work/_actions/really-yash/UWU-OrangeFox-Builder/main/OrangeFox/fox_12.1/out/target/product/air"
          echo "==== Output directory listing ===="
          ls -la "$OUT_DIR" || { echo "::error::Output directory not found — build likely failed silently!"; exit 1; }

          echo "==== File sizes ===="
          du -h "$OUT_DIR"/*.img "$OUT_DIR"/*.zip 2>/dev/null

          echo "==== SHA256 checksums ===="
          sha256sum "$OUT_DIR"/*.img "$OUT_DIR"/*.zip 2>/dev/null

          echo "==== Sanity check: a real recovery .img must exist ===="
          IMG_FILE=$(ls "$OUT_DIR"/OrangeFox*.img 2>/dev/null | head -1)
          if [ -z "$IMG_FILE" ]; then
            echo "::error::No OrangeFox .img file found. The build did not actually produce a raw image!"
            exit 1
          fi
          SIZE=$(stat -c%s "$IMG_FILE")
          echo "$IMG_FILE size: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::$IMG_FILE is only $SIZE bytes — this is too small to be a real image. Likely corrupted or empty!"
            exit 1
          fi
          echo "✅ $IMG_FILE looks like a real, non-empty image."
          echo "FOUND_IMG_PATH=$IMG_FILE" >> $GITHUB_ENV

      - name: Upload Raw Recovery .img for Boot Testing
        uses: actions/upload-artifact@v4
        with:
          name: air-recovery-raw-img
          path: ${{ env.FOUND_IMG_PATH }}
