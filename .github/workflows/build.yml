name: OrangeFox - Builder
on:
  workflow_dispatch:

jobs:
  build:
    name: 🦊 Building OrangeFox Recovery
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space (Prevent Storage Full)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up Swap Space (Prevent OOM Kill)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: OrangeFox Build
        uses: really-yash/UWU-OrangeFox-Builder@main
        with:
          FOX_SYNC_BRANCH: '12.1'
          USER_NAME: 'Yash'
          USER_EMAIL: 'bloxfruits_yash@example.com'
          DEVICE_TREE: 'https://github.com/really-yash/twrp_device_xiaomi_air'
          DEVICE_TREE_BRANCH: 'twrp-16.0'
          DEVICE_PATH: 'device/xiaomi/air'
          DEVICE_NAME: 'air'
          BUILD_TARGET: 'vendorboot'
          GH_RELEASE: 'true'

      - name: Verify Build Output Is Real (Not Corrupted/Empty)
        run: |
          OUT_DIR="/home/runner/work/_actions/really-yash/UWU-OrangeFox-Builder/main/OrangeFox/fox_12.1/out/target/product/air"
          echo "==== Output directory listing ===="
          ls -la "$OUT_DIR" || { echo "::error::Output directory not found — build likely failed silently!"; exit 1; }

          echo "==== File sizes ===="
          du -h "$OUT_DIR"/*.img "$OUT_DIR"/*.zip 2>/dev/null

          echo "==== Sanity check: vendor_boot.img must exist and be a real size ===="
          if [ ! -f "$OUT_DIR/vendor_boot.img" ]; then
            echo "::error::vendor_boot.img is MISSING. The build did not actually produce it!"
            exit 1
          fi
          SIZE=$(stat -c%s "$OUT_DIR/vendor_boot.img")
          echo "vendor_boot.img size: $SIZE bytes"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "::error::vendor_boot.img is only $SIZE bytes — too small to be real. Likely corrupted!"
            exit 1
          fi
          echo "✅ vendor_boot.img looks like a real, non-empty image."

      - name: Upload Raw vendor_boot.img for Boot Testing
        uses: actions/upload-artifact@v4
        with:
          name: air-vendor_boot-raw
          path: /home/runner/work/_actions/really-yash/UWU-OrangeFox-Builder/main/OrangeFox/fox_12.1/out/target/product/air/vendor_boot.img
